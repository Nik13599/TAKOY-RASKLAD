<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b06"><title>Специалист · ТАКОЙ РАСКЛАД</title><style>
:root{color-scheme:dark;--lime:#c4ff00;--lime2:#a7ef15;--bg:#070b06;--panel:#111810;--stroke:#334b27;--muted:#a5b79e;--text:#f7faec}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(ellipse at 65% -10%,#1b3213,transparent 45%),#070b06;color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100svh}.hide{display:none!important}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.35;cursor:not-allowed}
.top{height:75px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px clamp(16px,4vw,32px);border-bottom:1px solid var(--stroke);background:#081008e8;position:sticky;top:0;z-index:10;backdrop-filter:blur(20px)}.mark{display:flex;align-items:center;gap:12px}.bali{font:italic 900 30px Georgia,serif;letter-spacing:.1em}.marksmall{font-size:9px;letter-spacing:.18em;font-weight:900;color:var(--lime)}.marktitle{font-weight:900;letter-spacing:-.02em;line-height:1}.topbtn{border:1px solid var(--stroke);border-radius:10px;padding:9px 10px;background:#111b11;color:#ccd8c2;font-size:12px}.wrap{max-width:1400px;margin:auto;padding:clamp(15px,3vw,32px)}
.tabs{display:flex;gap:8px;padding-bottom:12px;align-items:center;overflow-x:auto;scrollbar-width:none}.tabs button{background:#182117;color:#bfccba;border:1px solid #33452b;padding:12px 14px;border-radius:10px;font-weight:800;white-space:nowrap}.tabs button.active{background:var(--lime);border-color:var(--lime);color:#081006}.badge{display:inline-block;background:#faffee28;padding:3px 6px;margin-left:5px;border-radius:6px;font-size:11px}.tabs button.active .badge{background:#17270a22}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0 18px}.metric{border:1px solid #2e4126;border-radius:14px;background:#111a0f;padding:14px}.metric b{display:block;font:900 clamp(21px,4vw,31px) Impact,'Arial Black',sans-serif;letter-spacing:.03em}.metric span{display:block;font:12px Arial,sans-serif;color:var(--muted);margin-top:3px}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;align-items:start}.sidebar{border:1px solid var(--stroke);border-radius:16px;padding:11px;background:#11180f;min-height:400px;max-height:calc(100svh - 265px);overflow:auto}.sidehead{font:800 13px Arial,sans-serif;letter-spacing:.07em;color:#d5e8c2;margin:5px 6px 13px}.sideitem{width:100%;text-align:left;border:1px solid transparent;background:#1a2517;border-radius:11px;color:var(--text);padding:12px;margin:0 0 7px;display:grid;gap:4px}.sideitem.active{border-color:var(--lime);background:#2c401b}.itemline{display:flex;align-items:center;justify-content:space-between;gap:7px}.itemno{font-weight:900;font-size:14px}.itemz{font-size:12px;color:#c5d9b6}.itemq{font-size:12px;color:#a5b69b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pill{font:900 10px Arial,sans-serif;border-radius:4px;padding:5px 6px;color:#101b0b;background:#9fff49}.pill.postponed{background:#ffd56e}.pill.seen{background:#4b6041;color:#d8e6d0}.pill.resolved{background:#5d7059;color:#fff}
.card{position:relative;overflow:hidden;border:2px solid #5b8b33;border-radius:19px;background:linear-gradient(155deg,#182315,#0e170d 45%,#0c100a);box-shadow:0 0 0 5px #0b110a,0 14px 70px #020802,0 0 35px #8ff00015;min-height:525px;touch-action:pan-y}
.card:before{content:"";position:absolute;left:-160px;top:100px;width:350px;height:350px;border-radius:50%;border:3px solid #8dff16;filter:blur(30px);opacity:.08;pointer-events:none}.cardtop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:22px 22px 10px}.entry{font:900 12px Arial,sans-serif;letter-spacing:.12em;color:var(--lime)}.no{font:italic 1000 clamp(36px,7vw,57px) Impact,'Arial Black',sans-serif;line-height:1.1;margin-top:4px}.time{font:12px/1.5 Arial,sans-serif;color:#aec7a5;text-align:right;white-space:nowrap}.time span{display:block}.sigil{text-align:center;margin:10px 24px 18px;border:1px solid #678b4c;border-radius:16px;background:radial-gradient(ellipse at center,#2c441b 0%,#0b1608 70%);padding:20px 10px 15px}.bigicon{font:clamp(86px,19vw,140px)/1.1 'DejaVu Sans',Arial,sans-serif;color:var(--lime);filter:drop-shadow(0 0 13px #baff0050)}.signname{font:italic 1000 clamp(24px,6vw,38px) Impact,'Arial Black',sans-serif;letter-spacing:.06em;margin:9px 0 4px}.details{font:700 13px Arial,sans-serif;color:#ccdabf}.details strong{color:#fff}
.questionbox{margin:0 22px 15px;background:#f9faf0;color:#0e1509;border:3px solid #c0ff00;border-radius:9px;padding:18px 17px 21px;min-height:132px}.qlabel{font:900 12px Arial,sans-serif;color:#465d33;letter-spacing:.11em;margin-bottom:14px}.questiontext{font:600 clamp(17px,4vw,22px)/1.48 Arial,sans-serif;overflow-wrap:anywhere;white-space:pre-wrap}
.state{margin:0 22px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px}.state small{color:#afc4a5;font-size:11px}.statuspill{padding:7px 11px;border:1px solid #6b8349;border-radius:30px;font:800 11px Arial,sans-serif;color:#c7ff6d}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 22px 25px}.act{min-height:53px;border-radius:9px;font-weight:900;font-size:14px;padding:13px 7px}.postpone{background:transparent;border:2px solid #cadd96;color:#f2fadf}.resolve{background:var(--lime);border:2px solid #eaffb8;color:#10170b}.restore{grid-column:1/-1;background:transparent;border:2px solid #aac980;color:#e6f4d5}.nav{display:flex;align-items:center;justify-content:center;gap:15px;margin:20px auto 9px}.nav button{border-radius:10px;width:48px;height:43px;background:#182617;border:1px solid #4a6e36;color:#eaffdc;font-size:22px}.pos{font:800 12px Arial,sans-serif;color:#b3c3ab;min-width:88px;text-align:center}.hint{font:12px Arial,sans-serif;text-align:center;color:#788b70;margin:4px 0 25px}
.login{max-width:420px;margin:10svh auto 0;padding:36px 24px;border-radius:20px;border:1px solid #436a2b;background:linear-gradient(150deg,#20321b,#0c140d);text-align:center;box-shadow:0 0 80px #69bf0012}.login .big{font:italic 1000 52px Impact,'Arial Black',sans-serif;color:var(--lime);line-height:1}.login h1{font-size:25px;margin:19px 0 8px}.login p{color:#a8c09f;font-size:14px;line-height:1.5}.login input{width:100%;padding:15px;background:#f8faf3;color:#111;border:2px solid #ceff9b;font-size:17px;border-radius:9px;margin:13px 0}.login button{width:100%;background:var(--lime);border:0;border-radius:9px;padding:16px;font-weight:900}.error{font:12px Arial,sans-serif;color:#ffadb0;min-height:20px;margin:13px 0}
.empty{text-align:center;padding:65px 18px;color:#b8c9ad;border:2px dashed #395332;border-radius:16px}.empty b{font:900 24px Impact,sans-serif;color:#e8ffd7}.message{font:12px Arial,sans-serif;color:#b9d0ae;text-align:center;padding:12px}
@media(max-width:800px){.top{height:66px}.bali{font-size:23px}.marktitle{font-size:13px}.wrap{padding:13px}.layout{display:block}.sidebar{display:none}.metric{padding:12px}.card{min-height:470px}.cardtop{padding:17px 18px 9px}.sigil{margin:8px 16px 13px;padding:16px 8px 12px}.questionbox{margin:0 16px 14px}.state{margin:0 16px 12px}.actions{margin:0 16px 21px}.time{font-size:10px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header class="top"><div class="mark"><div class="bali">BALI</div><div><div class="marksmall">NIGHTCLUB · КАМЕДИ-ШОУ</div><div class="marktitle">ТАКОЙ РАСКЛАД</div></div></div><button class="topbtn" id="logout">Выйти ↗</button></header>
<main class="wrap"><section class="login" id="login"><div class="big">✦ BALI ✦</div><h1>ПАНЕЛЬ СПЕЦИАЛИСТА</h1><p>Анкеты шоу «Такой расклад»<br>Вход только для организаторов</p><form id="loginForm"><input id="password" type="password" placeholder="Пароль доступа" autocomplete="current-password" required><button type="submit">ВОЙТИ →</button><div class="error" id="loginErr"></div></form></section>
<section id="dashboard" class="hide"><div class="tabs"><button id="activeTab" class="active" type="button">⚡ АКТИВНЫЕ <span class="badge" id="activeCount">0</span></button><button id="historyTab" type="button">✓ ИСТОРИЯ РАЗОБРАННЫХ <span class="badge" id="historyCount">0</span></button><button id="refresh" type="button" title="Обновить">↻</button></div>
<div class="metrics"><div class="metric"><b id="totalM">0</b><span>Всего анкет</span></div><div class="metric"><b id="unseenM">0</b><span>Не открывали</span></div><div class="metric"><b id="postM">0</b><span>Отложено</span></div></div>
<div class="layout"><aside class="sidebar"><div class="sidehead" id="sideTitle">СПИСОК АНКЕТ · ПО ВРЕМЕНИ</div><div id="list"></div></aside><div><article id="card" class="card" aria-live="polite"></article><div class="nav"><button type="button" id="prev" aria-label="Предыдущая анкета">‹</button><div id="pos" class="pos">0 / 0</div><button type="button" id="next" aria-label="Следующая анкета">›</button></div><div class="hint">Листай карточки свайпом влево или вправо</div><div class="message" id="message"></div></div></div></section></main>
<script>
const Z={aries:['♈','ОВЕН'],taurus:['♉','ТЕЛЕЦ'],gemini:['♊','БЛИЗНЕЦЫ'],cancer:['♋','РАК'],leo:['♌','ЛЕВ'],virgo:['♍','ДЕВА'],libra:['♎','ВЕСЫ'],scorpio:['♏','СКОРПИОН'],sagittarius:['♐','СТРЕЛЕЦ'],capricorn:['♑','КОЗЕРОГ'],aquarius:['♒','ВОДОЛЕЙ'],pisces:['♓','РЫБЫ']};
const $=s=>document.querySelector(s),D={version:0,items:[],total:0,active:0,unseen:0,postponed:0,resolved:0};let tab='active',index=0,selectedNumber=null,requesting=false,first=true;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(t){return t?new Date(t).toLocaleString('ru-RU',{timeZone:'Europe/Minsk',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):''}
function group(){return D.items.filter(v=>tab==='active'?v.status!=='resolved':v.status==='resolved').sort((a,b)=>a.number-b.number)}
function pick(){const items=group();if(selectedNumber!==null){const found=items.findIndex(i=>i.number===selectedNumber);if(found>=0)index=found;else index=Math.min(index,Math.max(0,items.length-1))}else index=Math.min(index,Math.max(0,items.length-1));return items}
function statusText(v){if(v.status==='resolved')return 'РАЗОБРАНА';if(v.status==='postponed')return 'ОТЛОЖЕНА';return v.seen_at?'ПРОСМОТРЕНА':'НОВАЯ'}
function render(){const items=pick(),v=items[index];selectedNumber=v?.number??null;
$('#totalM').textContent=D.total;$('#unseenM').textContent=D.unseen;$('#postM').textContent=D.postponed;$('#activeCount').textContent=D.active;$('#historyCount').textContent=D.resolved;
$('#activeTab').classList.toggle('active',tab==='active');$('#historyTab').classList.toggle('active',tab==='history');$('#sideTitle').textContent=tab==='active'?'АКТИВНЫЕ · ПО ПОРЯДКУ':'ИСТОРИЯ · ПО ПОРЯДКУ';
$('#pos').textContent=items.length?(index+1)+' / '+items.length:'0 / 0';$('#prev').disabled=index===0||!v;$('#next').disabled=index>=items.length-1||!v;
$('#list').innerHTML=items.map(x=>'<button type="button" data-num="'+x.number+'" class="sideitem '+(x.number===selectedNumber?'active':'')+'"><span class="itemline"><span class="itemno">АНКЕТА №'+x.number+'</span><span class="pill '+(x.status==='resolved'?'resolved':x.status==='postponed'?'postponed':x.seen_at?'seen':'')+'">'+statusText(x)+'</span></span><span class="itemz">'+esc(Z[x.zodiac]?.[0]||'✦')+' '+esc(Z[x.zodiac]?.[1]||'—')+' · '+x.age+' лет</span><span class="itemq">'+esc(x.question)+'</span></button>').join('');
if(!v){$('#card').innerHTML='<div class="empty" style="margin:25px"><div style="font-size:54px;color:#baff00">✦</div><b>'+(tab==='active'?'Активных анкет пока нет':'История пока пуста')+'</b><p>'+(tab==='active'?'Новые вопросы появятся здесь автоматически.':'Разобранные вопросы будут сохраняться здесь.')+'</p></div>';return}
const z=Z[v.zodiac]||['✦','НЕИЗВЕСТНО'];
$('#card').innerHTML='<div class="cardtop"><div><div class="entry">'+(tab==='active'?'АКТИВНАЯ АНКЕТА':'ИСТОРИЯ РАЗБОРА')+'</div><div class="no">АНКЕТА №'+v.number+'</div></div><div class="time"><span>Поступила</span><span>'+fmt(v.created_at)+'</span></div></div>'+
'<div class="sigil"><div class="bigicon">'+z[0]+'</div><div class="signname">'+z[1]+'</div><div class="details">'+(v.gender==='male'?'♂ МУЖСКОЙ':'♀ ЖЕНСКИЙ')+' &nbsp; · &nbsp; <strong>'+v.age+' ЛЕТ</strong></div></div>'+
'<div class="questionbox"><div class="qlabel">✦ ВОПРОС СПЕЦИАЛИСТУ</div><div class="questiontext">'+esc(v.question)+'</div></div>'+
'<div class="state"><span class="statuspill">'+statusText(v)+'</span><small>'+(v.status==='resolved'?'Разобрана: '+fmt(v.resolved_at):v.seen_at?'Открыта: '+fmt(v.seen_at):'Ещё не открыта')+'</small></div>'+
'<div class="actions">'+(v.status==='resolved'?'<div style="grid-column:1/-1;text-align:center;color:#bdf07f;padding:12px">✓ ВОПРОС РАЗОБРАН · ДОСТУПЕН В ИСТОРИИ</div>':'<button type="button" id="postponeAction" class="act postpone">◷ ОТЛОЖИТЬ ВОПРОС</button><button type="button" id="resolveAction" class="act resolve">✓ РАЗОБРАНА</button>')+'</div>';
if(v.status==='new'&&!v.seen_at)markSeen(v);
}
async function request(url,options){const res=await fetch(url,{credentials:'same-origin',...options});if(res.status===401){showLogin();throw new Error('Сессия истекла')}if(!res.ok){const x=await res.json().catch(()=>({}));throw new Error(x.error||'Ошибка соединения')}return res.status===204?null:res.json()}
function showLogin(){$('#dashboard').classList.add('hide');$('#login').classList.remove('hide');$('#logout').classList.add('hide')}
function showDashboard(){$('#login').classList.add('hide');$('#dashboard').classList.remove('hide');$('#logout').classList.remove('hide')}
function recount(){D.total=D.items.length;D.active=D.items.filter(x=>x.status!=='resolved').length;D.resolved=D.items.filter(x=>x.status==='resolved').length;D.unseen=D.items.filter(x=>(x.status==='new'&&!x.seen_at)||x.status==='postponed').length;D.postponed=D.items.filter(x=>x.status==='postponed').length}
async function refresh(force=false){if(requesting||document.hidden)return;requesting=true;try{const url='/api/admin/snapshot'+(!force&&D.version?'?version='+encodeURIComponent(D.version):'');const res=await request(url);if(res){const previous=selectedNumber;D.version=res.version;D.items=res.items;D.total=res.total;D.active=res.active;D.resolved=res.resolved;D.unseen=res.unseen;D.postponed=res.postponed;selectedNumber=previous;render()}}catch(e){$('#message').textContent=e.message}finally{requesting=false}}
async function markSeen(v){v.seen_at=new Date().toISOString();recount();try{await request('/api/admin/seen/'+v.number,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});}catch(e){$('#message').textContent='Не удалось отметить просмотр: '+e.message}}
async function changeStatus(status){const items=group(),v=items[index];if(!v)return;const next=items[index+1]||items[index-1]||null;try{await request('/api/admin/status/'+v.number,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});v.status=status;v.seen_at=v.seen_at||new Date().toISOString();if(status==='resolved')v.resolved_at=new Date().toISOString();else v.resolved_at=null;selectedNumber=next?.number??null;recount();render();$('#message').textContent=status==='resolved'?'✓ Анкета №'+v.number+' перенесена в историю':status==='postponed'?'◷ Анкета №'+v.number+' отложена':'Анкета №'+v.number+' возвращена';}catch(e){$('#message').textContent=e.message}}
function navigate(dir){const items=group(),n=index+dir;if(n<0||n>=items.length)return;index=n;selectedNumber=items[n].number;render();$('#message').textContent=''}
$('#prev').onclick=()=>navigate(-1);$('#next').onclick=()=>navigate(1);
$('#activeTab').onclick=()=>{tab='active';index=0;selectedNumber=null;render()};$('#historyTab').onclick=()=>{tab='history';index=0;selectedNumber=null;render()};
$('#refresh').onclick=()=>refresh(true);
$('#list').onclick=e=>{const b=e.target.closest('button[data-num]');if(!b)return;selectedNumber=Number(b.dataset.num);render()};
$('#card').onclick=e=>{if(e.target.closest('#resolveAction'))changeStatus('resolved');else if(e.target.closest('#postponeAction'))changeStatus('postponed');};
let swipeX=null,swipeY=null;
$('#card').addEventListener('touchstart',e=>{if(e.touches.length===1){swipeX=e.touches[0].clientX;swipeY=e.touches[0].clientY}},{passive:true});
$('#card').addEventListener('touchend',e=>{if(swipeX===null)return;const dx=e.changedTouches[0].clientX-swipeX,dy=e.changedTouches[0].clientY-swipeY;swipeX=null;swipeY=null;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.25)navigate(dx<0?1:-1)},{passive:true});
document.addEventListener('keydown',e=>{if($('#dashboard').classList.contains('hide')||e.target.matches('input,textarea'))return;if(e.key==='ArrowLeft')navigate(-1);if(e.key==='ArrowRight')navigate(1)});
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginErr').textContent='';const pass=$('#password').value;try{await request('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pass})});$('#password').value='';showDashboard();await refresh(true)}catch(err){$('#loginErr').textContent=err.message}};
$('#logout').onclick=async()=>{try{await request('/api/admin/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})}finally{showLogin();D.items=[];D.version=0}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#dashboard').classList.contains('hide'))refresh()});
setInterval(()=>{if(!document.hidden&&!$('#dashboard').classList.contains('hide'))refresh()},20000);
(async()=>{try{await request('/api/admin/me');showDashboard();await refresh(true)}catch{showLogin()}})();
</script></body></html>
